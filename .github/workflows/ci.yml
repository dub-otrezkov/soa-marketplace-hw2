name: Build and end-to-end verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-marketplace-signing-key-not-a-production-secret-64chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Generate interfaces and models
        run: make generate
      - name: Compile, vet and test
        run: |
          go vet ./...
          go test -race ./...
          go build -o bin/marketplace ./cmd/marketplace
      - name: Start PostgreSQL, Flyway and Go API
        run: docker compose up --build --detach --wait
      - name: Run end-to-end scenarios and database checks
        run: python3 scripts/e2e.py --db-checks
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
