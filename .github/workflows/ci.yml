name: Build and end-to-end verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-marketplace-signing-key-not-a-production-secret-64chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate contract, compile and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Start PostgreSQL and API
        run: docker compose up --build --detach --wait
      - name: Run end-to-end scenarios
        run: python3 scripts/e2e.py --db-checks
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
