spring:
  application:
    name: soa-marketplace
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DATABASE_USER:marketplace}
    password: ${DATABASE_PASSWORD:marketplace-local}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
marketplace:
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: 20
  refresh-token-days: 14
  order-cooldown-minutes: ${ORDER_COOLDOWN_MINUTES:1}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
server:
  error:
    include-message: never
    include-stacktrace: never
